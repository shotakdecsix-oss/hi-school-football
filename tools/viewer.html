<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>試合ビューア（段階2）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 14px system-ui, sans-serif; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: #161b22; }
  #bar input, #bar select, #bar button { font: inherit; padding: 3px 6px; background: #21262d; color: inherit; border: 1px solid #30363d; border-radius: 4px; }
  #bar input[type=number] { width: 4.2em; }
  #score { margin-left: auto; font-weight: 700; font-size: 16px; }
  svg { display: block; width: 100vw; height: calc(100vh - 44px); }
  #tac { background: #161b22; border-top: 1px solid #30363d; padding: 0 8px; }
  #tac summary { padding: 5px 0; cursor: pointer; }
  #tacBody { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding-bottom: 8px; }
  #tacBody h4 { margin: 2px 0; font-size: 13px; }
  #tacBody .row { font-size: 12px; margin-bottom: 4px; }
  #tacBody .row b { color: #58a6ff; font-weight: 600; }
  #tacBody input[type=range] { width: 100%; margin: 2px 0 0; }
</style>
</head>
<body>
<div id="bar">
  <label>種 <input id="seed" type="number" value="1"></label>
  <select id="hf"></select> vs <select id="af"></select>
  <select id="rl"></select>
  <label>力 <input id="ha" type="number" value="10"> - <input id="aa" type="number" value="10"></label>
  <button id="go">最初から</button>
  <button id="pz">一時停止</button>
  <span id="spd"></span>
  <label><input id="roles" type="checkbox" checked> 役割の色</label>
  <label title="オフにすると、全員がピッチの全部が見えている従来の動き（比較用）。切り替えると最初からやり直す"><input id="pc" type="checkbox" checked> 認知</label>
  <select id="vw" title="体の向き（白い線）と視野（扇形）の表示。一人 = 選手をクリックするとその目線になる（もう一度クリックでボール保持者に戻る）。目線の選手に見えていない選手は薄くなる"><option value="1">視野: 一人</option><option value="2">視野: 全員</option><option value="0">視野: なし</option></select>
  <small id="vinfo" style="opacity:.85"></small>
  <small id="legend" style="opacity:.7"></small>
  <span id="score"></span>
  <span id="sta" title="外野手10人のスタミナの平均（100%=万全）。走ると減り、減るほど遅くなる。ハーフタイムと交代で回復" style="margin-left:12px;opacity:.85"></span>
</div>
<details id="tac"><summary>戦術（チーム指示）<small style="opacity:.7">　途中で動かすと、その場から効く</small></summary>
  <div id="tacBody"></div>
  <button id="tacReset" style="margin:0 0 8px;font:inherit;padding:3px 8px;background:#21262d;color:inherit;border:1px solid #30363d;border-radius:4px">全部標準に戻す</button>
</details>
<svg id="sv" preserveAspectRatio="xMidYMid meet"></svg>
<script type="module">
// 読み込みに失敗したとき画面にエラーが出るよう、動的importにしている
let mods;
try {
  mods = await Promise.all([
    import('../engine/match.js'), import('../engine/sample.js'), import('../engine/consts.js'),
    import('../data/formations.js'), import('../render/view2d.js'), import('../data/rules.js'), import('../data/tactics.js'),
  ]);
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f85149;padding:12px;white-space:pre-wrap">読み込みエラー: ' + e + '</pre>');
  throw e;
}
const [{ createMatch, stepMatch, frame, setTactics, staminaOf }, { sampleInput }, { DT, TICK_HZ }, { FORMATIONS }, { VIEWBOX, pitchSvg, actorsSvg, lerpFrame, ROLE_LEGEND }, { RULES }, { TACTICS }] = mods;

const $ = (id) => document.getElementById(id);
for (const id of ['hf', 'af']) for (const f of Object.keys(FORMATIONS)) $(id).add(new Option(f, f));
$('af').value = '4-3-3';
for (const k of Object.keys(RULES)) $('rl').add(new Option(RULES[k].name, k));
// チーム指示のスライダー（効くものだけ。5段階: -2〜+2 → -1〜+1）。動かすとすぐ試合に反映する
const ON = TACTICS.filter((d) => d.on);
const sliders = [0, 1].map(() => ({}));
const tacText = (d, v) => (v === 0 ? '標準' : (Math.abs(v) === 1 ? 'やや' : '') + (v < 0 ? d.lo : d.hi));
const tacOf = (k) => Object.fromEntries(ON.map((d) => [d.key, +sliders[k][d.key].value / 2]));
for (let k = 0; k < 2; k++) {
  const col = document.createElement('div');
  col.innerHTML = `<h4>チーム${k}（${k ? '青' : '赤'}）</h4>`;
  for (const d of ON) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `${d.group}：${d.name} <b></b><br><input type="range" min="-2" max="2" step="1" value="0">`;
    const inp = row.querySelector('input'), b = row.querySelector('b');
    sliders[k][d.key] = inp;
    inp.oninput = () => { b.textContent = tacText(d, +inp.value); if (m) setTactics(m, k, tacOf(k)); };
    b.textContent = tacText(d, 0);
    col.append(row);
  }
  $('tacBody').append(col);
}
$('tacReset').onclick = () => { for (let k = 0; k < 2; k++) for (const d of ON) { sliders[k][d.key].value = 0; sliders[k][d.key].oninput(); } };
const sv = $('sv');
sv.setAttribute('viewBox', VIEWBOX);
sv.innerHTML = pitchSvg() + '<g id="act"></g>';
const act = $('act');
$('legend').textContent = ROLE_LEGEND;

let m, prev, cur, vp = -1, acc = 0, speed = 4, paused = false, last = performance.now(), holdUntil = 0, banner = '', ended = false;
const PERIOD = ['', '前半', '後半', '延長前半', '延長後半', 'PK戦'], BREAK = ['', 'ハーフタイム', '延長へ', '延長ハーフタイム', 'PK戦へ'], PKRES = ['外れ', 'ゴール！', 'セーブ！'];
function start() {
  m = createMatch(sampleInput(+$('seed').value || 1, {
    home: $('hf').value, away: $('af').value, abilHome: +$('ha').value, abilAway: +$('aa').value, rules: RULES[$('rl').value],
    homeTac: tacOf(0), awayTac: tacOf(1), percept: $('pc').checked ? undefined : 0,
  }));
  vp = -1;
  prev = cur = frame(m, vp);
  acc = 0; holdUntil = 0; banner = ''; ended = false;
}
$('go').onclick = start;
$('pc').onchange = start;
sv.onclick = (e) => { // 選手をクリック → その選手の目線（もう一度クリックでボール保持者に戻る）
  if (!cur.face) return;
  const pt = sv.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(sv.getScreenCTM().inverse());
  let best = -1, bd = 9; // 3m 以内でいちばん近い選手
  for (let i = 0; i < 22; i++) { const dx = cur.xy[2 * i] - q.x, dy = cur.xy[2 * i + 1] - q.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  vp = best >= 0 && best !== vp ? best : -1;
  cur = frame(m, vp);
};
$('pz').onclick = () => { paused = !paused; $('pz').textContent = paused ? '再開' : '一時停止'; };
for (const s of [1, 4, 16, 60]) {
  const b = document.createElement('button');
  b.textContent = '×' + s;
  b.onclick = () => { speed = s; };
  $('spd').append(b);
}

function loop(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (now < holdUntil) acc = 0; // 区間の切れ目（ハーフタイムなど）は、少し止めて見せる
  else if (!paused) {
    acc += dtReal * speed;
    let n = 0;
    while (acc >= DT && n < 1500) {
      if (!stepMatch(m)) { acc = 0; banner = '試合終了'; ended = true; break; }
      prev = cur; cur = frame(m, vp); acc -= DT; n++;
      if (cur.half !== prev.half) { banner = cur.half === 5 ? 'PK戦へ' : BREAK[prev.half]; holdUntil = now + 2500; acc = 0; break; }
      if (cur.half === 5 && cur.pkr !== prev.pkr && cur.pkr >= 0) { banner = PKRES[cur.pkr]; holdUntil = now + 1500; acc = 0; break; } // PK戦: 1本ごとの結果を少し見せる
    }
    if (n >= 1500) acc = 0;
    if (now >= holdUntil && banner && !ended) banner = '';
  }
  act.innerHTML = actorsSvg(lerpFrame(prev, cur, Math.min(1, acc / DT)), $('roles').checked, { view: +$('vw').value });
  const sec = Math.floor(cur.t / TICK_HZ);
  $('score').textContent = `${cur.score[0]} - ${cur.score[1]}   ${PERIOD[cur.half]}${cur.half === 5 ? ` ${cur.pk[0]} - ${cur.pk[1]}` : ` ${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`}${banner ? '　' + banner : ''}`;
  $('vinfo').textContent = !cur.face ? '' : cur.seeBy < 0 ? '目線: （ボールは誰も持っていない）' : `目線: ${cur.seeBy < 11 ? '赤' : '青'}${(cur.seeBy % 11) + 1}番${vp < 0 ? '（保持者）' : ''}　気づき ${Math.round(100 * cur.scn[cur.seeBy])}%`;
  $('sta').textContent = `体力 赤${Math.round(100 * staminaOf(m, 0))}% 青${Math.round(100 * staminaOf(m, 1))}%`;
  requestAnimationFrame(loop);
}
start();
requestAnimationFrame(loop);
</script>
</body>
</html>
